{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3 p-4 mt-4">
                <h4 class="fw-bold text-center mb-4 text-primary">تسجيل دخول المدير</h4>
                
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control" required placeholder="أدخل اسم المستخدم">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2 fw-bold">تسجيل الدخول</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">بيانات التجربة: admin / admin123</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
